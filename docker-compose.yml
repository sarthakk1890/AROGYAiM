services:
  db:
    image: postgres:15-alpine
    container_name: mova_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mova
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mova"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mova_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://user:password@db:5432/mova?schema=public
      - CORS_ORIGIN=http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=docker_secret_key
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=docker_refresh_secret
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: mova_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
